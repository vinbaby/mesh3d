[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-3d-studio"
version = "0.9.0"
description = "VIN 3D Studio unified Rig Rope controls and skin preview"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.7,<0.14",
  "PyOpenGL>=3.1.7,<4",
  "trimesh>=4.4,<5",
  "numpy>=1.26,<3",
  "Pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
paint-uv = ["xatlas>=0.0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
