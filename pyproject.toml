[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-3d-studio"
version = "0.1.0"
description = "VIN 3D Studio clean-start desktop prototype"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
