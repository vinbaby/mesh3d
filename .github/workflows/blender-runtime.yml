name: Blender Runtime Smoke Test

on:
  push:
    paths:
      - "blender_addon/**"
      - "tests/blender_runtime_smoke.py"
      - "tests/vin_motion_lab_runtime_smoke.py"
      - ".github/workflows/blender-runtime.yml"
  pull_request:
    paths:
      - "blender_addon/**"
      - "tests/blender_runtime_smoke.py"
      - ".github/workflows/blender-runtime.yml"

jobs:
  blender-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Test VIN Procedural Lab in background Blender
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python tests/blender_runtime_smoke.py 2>&1 | tee blender-runtime.log
          grep -q "VIN Procedural Lab Blender runtime smoke test passed." blender-runtime.log
      - name: Test VIN Motion Lab in background Blender
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python tests/vin_motion_lab_runtime_smoke.py 2>&1 | tee vin-motion-runtime.log
          grep -q "VIN Motion Lab runtime smoke test passed." vin-motion-runtime.log
